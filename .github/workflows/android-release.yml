name: Android Release

on:
  push:
    branches:
      - android-app
      - android-app-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run android:apk:debug

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="android-v1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk TrueSpend.apk
          gh release create "$release_tag" \
            TrueSpend.apk \
            --target "$GITHUB_SHA" \
            --title "TrueSpend Android $release_tag" \
            --generate-notes